<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>vigie-emploi</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Theme, palette, zoom and chosen language applied before rendering (no flash).
      try {
        var t = localStorage.getItem('vigie-emploi:theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        var v = JSON.parse(localStorage.getItem(dark ? 'vigie-emploi:palette-vars-dark' : 'vigie-emploi:palette-vars-light') || '{}');
        for (var k in v) document.documentElement.style.setProperty(k, v[k]);
        var z = Number(localStorage.getItem('vigie-emploi:zoom'));
        if (z >= 75 && z <= 175) document.documentElement.style.fontSize = z + '%';
        var l = localStorage.getItem('vigie-emploi:language');
        if (l && /^[a-z]{2,3}(-[A-Za-z0-9]+)?$/.test(l)) document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
